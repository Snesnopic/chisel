name: Multi-platform build

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.asset_name }})
    runs-on: ${{ matrix.runs_on }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - id: ubuntu-gcc
            runs_on: ubuntu-latest
            build_type: Release
            c_compiler: gcc
            cpp_compiler: g++
            binary_path: bin/Release/chsl
            asset_name: "linux-x64-gcc"

          - id: ubuntu-clang
            runs_on: ubuntu-latest
            build_type: Release
            c_compiler: clang
            cpp_compiler: clang++
            binary_path: bin/Release/chsl
            asset_name: "linux-x64-clang"

          - id: ubuntu-arm
            runs_on: ubuntu-24.04-arm
            build_type: Release
            c_compiler: gcc
            cpp_compiler: g++
            binary_path: bin/Release/chsl
            asset_name: "linux-arm64"

          - id: ubuntu-x86
            runs_on: ubuntu-latest
            build_type: Release
            c_compiler: gcc
            cpp_compiler: g++
            extra_cmake_args: -DCMAKE_C_FLAGS=-m32 -DCMAKE_CXX_FLAGS=-m32 -DCMAKE_ASM_FLAGS=-m32 -DCMAKE_EXE_LINKER_FLAGS=-m32 -DCMAKE_LIBRARY_PATH=/usr/lib/i386-linux-gnu -DRust_CARGO_TARGET=i686-unknown-linux-gnu -DRust_RUSTUP_INSTALL_MISSING_TARGET=ON
            binary_path: bin/Release/chsl
            asset_name: "linux-x86"

          - id: macos-intel
            runs_on: macos-15-intel
            build_type: Release
            c_compiler: clang
            cpp_compiler: clang++
            extra_cmake_args: -DCMAKE_OSX_SYSROOT=$SDKROOT
            binary_path: bin/Release/chsl
            asset_name: "macos-x64"

          - id: macos-arm
            runs_on: macos-26
            build_type: Release
            c_compiler: clang
            cpp_compiler: clang++
            extra_cmake_args: -DCMAKE_OSX_SYSROOT=$SDKROOT
            binary_path: bin/Release/chsl
            asset_name: "macos-arm64"

          - id: windows-x64
            runs_on: windows-latest
            build_type: Release
            c_compiler: cl
            cpp_compiler: cl
            extra_cmake_args: -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows-static
            binary_path: bin/Release/chsl.exe
            asset_name: "windows-x64"

          - id: windows-arm
            runs_on: windows-11-arm
            build_type: Release
            c_compiler: cl
            cpp_compiler: cl
            extra_cmake_args: -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=arm64-windows-static
            binary_path: bin/Release/chsl.exe
            asset_name: "windows-arm64"

          - id: windows-x86
            runs_on: windows-latest
            build_type: Release
            c_compiler: cl
            cpp_compiler: cl
            extra_cmake_args: -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x86-windows-static
            binary_path: bin/Release/chsl.exe
            asset_name: "windows-x86"

    steps:
      - name: Disable Git AutoCRLF
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
          lfs: true

      - name: Setup Git LFS
        run: |
          git lfs install
          git lfs pull



      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          # a mirror that drops a connection makes apt give up the whole install
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries > /dev/null
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config \
            autoconf automake libtool m4 nasm yasm curl unzip tar gzip python3-pip

      - name: Install multilib dependencies (Linux x86)
        if: matrix.id == 'ubuntu-x86'
        run: |
          sudo dpkg --add-architecture i386
          # a mirror that drops a connection makes apt give up the whole install
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries > /dev/null
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib libc6:i386 libc6-dev:i386

          # gcc-multilib/g++-multilib pull in the "biarch" libc6-dev-i386 shim
          # (headers + symlinks for -m32 compiling), but on some images that
          # does NOT transitively install the actual libc6:i386 multiarch
          # runtime package, leaving libm.so.6/libc.so.6 for i386 missing
          # entirely (hence the explicit install above). Locate the runtime
          # wherever it actually landed instead of assuming a fixed path.
          echo "--- searching for the 32-bit libm runtime ---"
          sudo find /usr/lib /lib -iname 'libm.so*' 2>/dev/null

          real_libm=$(sudo find /usr/lib /lib -name 'libm.so.*' 2>/dev/null | grep -v x86_64 | sort -V | tail -1)
          echo "Resolved 32-bit libm: ${real_libm:-<none found>}"

          if [ -z "$real_libm" ]; then
            echo "::error::Could not locate a 32-bit libm.so.* anywhere under /usr/lib or /lib"
            exit 1
          fi

          # normalize it under the multiarch path that CMAKE_LIBRARY_PATH points to
          sudo mkdir -p /usr/lib/i386-linux-gnu
          if [ ! -e /usr/lib/i386-linux-gnu/libm.so ]; then
            sudo ln -s "$real_libm" /usr/lib/i386-linux-gnu/libm.so
            echo "Linked /usr/lib/i386-linux-gnu/libm.so -> $real_libm"
          fi

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew remove --force --ignore-dependencies $(brew list --formula)
          brew remove --cask --force $(brew list)
          brew install autoconf automake libtool nasm yasm cmake ninja
          # compile and link against the selected Xcode's SDK: the image also ships a newer Command Line Tools SDK
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
          xcode-select -p
          xcrun --sdk macosx --show-sdk-path

      - name: Setup MSVC Developer Environment
        if: runner.os == 'Windows'
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: ${{ matrix.id == 'windows-arm' && 'arm64' || (matrix.id == 'windows-x86' && 'x86' || 'x64') }}

      - name: Install build dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache-workspaces: "libchisel/rust_bridge"

      - name: Set build output directory
        id: strings
        shell: bash
        run: echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

      - name: Configure CMake
        run: >
          cmake -B ${{ steps.strings.outputs.build-output-dir }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          ${{ matrix.extra_cmake_args }}
          -S ${{ github.workspace }}

      - name: Build
        run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

      - name: Show the link command (macOS)
        if: failure() && runner.os == 'macOS'
        run: cat "${{ steps.strings.outputs.build-output-dir }}/chisel_cli/CMakeFiles/chisel.dir/link.txt"


      - name: Package binary
        if: runner.os != 'Windows'
        run: |
          mkdir -p package
          cp "${{ matrix.binary_path }}" package/chsl
          chmod 755 package/chsl
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            tar --no-mac-metadata -czf "chsl-${{ matrix.asset_name }}.tar.gz" -C package chsl
          else
            tar -czf "chsl-${{ matrix.asset_name }}.tar.gz" -C package chsl
          fi
          echo "ASSET=chsl-${{ matrix.asset_name }}.tar.gz" >> "$GITHUB_ENV"

      - name: Package binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item "${{ matrix.binary_path }}" package/chsl.exe
          Compress-Archive -Path package/chsl.exe -DestinationPath "chsl-${{ matrix.asset_name }}.zip"
          "ASSET=chsl-${{ matrix.asset_name }}.zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # uploaded without a zip around it, so the artifact is the release asset itself
      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.ASSET }}
          archive: false
          if-no-files-found: error

  test:
    name: test (${{ matrix.asset_name }})
    needs: build
    runs-on: ${{ matrix.runs_on }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - id: ubuntu-gcc
            runs_on: ubuntu-latest
            asset_name: "linux-x64-gcc"

          - id: ubuntu-clang
            runs_on: ubuntu-latest
            asset_name: "linux-x64-clang"

          - id: ubuntu-arm
            runs_on: ubuntu-24.04-arm
            asset_name: "linux-arm64"

          - id: ubuntu-x86
            runs_on: ubuntu-latest
            asset_name: "linux-x86"

          - id: macos-intel
            runs_on: macos-15-intel
            asset_name: "macos-x64"

          - id: macos-arm
            runs_on: macos-26
            asset_name: "macos-arm64"

          - id: windows-x64
            runs_on: windows-latest
            asset_name: "windows-x64"
          # disabled, takes longer than 6 hours
          #- id: windows-arm
          #  runs_on: windows-11-arm
          #  asset_name: "windows-arm64"

    env:
      TEST_ARCHIVE_NAME: chisel_samples.zip
      TEST_DIR: test-data
      BIN_DIR: bin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download binary artifact
        uses: actions/download-artifact@v8
        with:
          name: chsl-${{ matrix.asset_name }}${{ runner.os == 'Windows' && '.zip' || '.tar.gz' }}
          path: ${{ env.BIN_DIR }}
          # the zip is the release asset itself: keep it as it was uploaded
          skip-decompress: true

      - name: Extract binary
        if: runner.os != 'Windows'
        run: |
          cd ${{ env.BIN_DIR }}
          tar -xzf "$(find . -name 'chsl-*.tar.gz' | head -1)"
          ls -la

      - name: Extract binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Get-ChildItem -Path "${{ env.BIN_DIR }}" -Recurse -Filter "chsl-*.zip" | Select-Object -First 1
          Expand-Archive -Path $archive.FullName -DestinationPath "${{ env.BIN_DIR }}" -Force
          Get-ChildItem "${{ env.BIN_DIR }}"

      - name: Install test dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          # a mirror that drops a connection makes apt give up the whole install
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries > /dev/null
          sudo apt-get update
          sudo apt-get install -y python3-pip unzip
          pip3 install --upgrade google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Install test dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install unzip
          python3 -m venv ${{ github.workspace }}/venv-gdrive
          ${{ github.workspace }}/venv-gdrive/bin/pip3 install --upgrade google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Install test dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade google-api-python-client google-auth-httplib2 google-auth-oauthlib
        shell: bash

      - name: Cache test data archive
        id: cache-test-archive
        uses: actions/cache@v5
        with:
          path: ${{ env.TEST_ARCHIVE_NAME }}
          key: ${{ runner.os }}-testarchive-v8-${{ secrets.GDRIVE_FILE_ID }}

      - name: Authenticate and Download Test Data from Google Drive
        if: steps.cache-test-archive.outputs.cache-hit != 'true'
        env:
          GDRIVE_CREDENTIALS_JSON: ${{ secrets.GDRIVE_CREDENTIALS_JSON }}
          GDRIVE_FILE_ID: ${{ secrets.GDRIVE_FILE_ID }}
        run: |
          PY_EXE="python3"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            PY_EXE="python"
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            # Point to the python inside the venv
            PY_EXE="${{ github.workspace }}/venv-gdrive/bin/python3"
          fi

          "$PY_EXE" -c "
          import os
          import io
          import json
          import sys
          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaIoBaseDownload
          
          creds_json_string = os.environ.get('GDRIVE_CREDENTIALS_JSON')
          if not creds_json_string:
            print('::error::Secret GDRIVE_CREDENTIALS_JSON is not set.', file=sys.stderr)
            sys.exit(1)
          
          try:
            creds_info = json.loads(creds_json_string)
            creds = service_account.Credentials.from_service_account_info(creds_info)
          except json.JSONDecodeError:
            print('::error::Could not decode credentials JSON. Check the secret.', file=sys.stderr)
            sys.exit(1)
          except Exception as e:
            print(f'::error::Failed to load service account credentials: {e}', file=sys.stderr)
            sys.exit(1)
          
          file_id = os.environ.get('GDRIVE_FILE_ID')
          output_filename = os.environ.get('TEST_ARCHIVE_NAME')
          
          if not file_id:
            print('::error::Secret GDRIVE_FILE_ID is not set.', file=sys.stderr)
            sys.exit(1)
          if not output_filename:
            print('::error::Environment variable TEST_ARCHIVE_NAME is not set.', file=sys.stderr)
            sys.exit(1)
          
            print(f'Authenticating and creating Google Drive service...')
          try:
            service = build('drive', 'v3', credentials=creds)
          except Exception as e:
            print(f'::error::Failed to build Drive service: {e}', file=sys.stderr)
            sys.exit(1)
          
          print(f'Requesting file ID: {file_id}...')
          try:
            request = service.files().get_media(fileId=file_id)
          except Exception as e:
            print(f'::error::Failed to create download request for file ID {file_id}: {e}', file=sys.stderr)
            sys.exit(1)
          
          try:
            print(f'Opening output file: {output_filename}...')
            fh = io.FileIO(output_filename, 'wb')
          except Exception as e:
            print(f'::error::Failed to open output file {output_filename} for writing: {e}', file=sys.stderr)
            sys.exit(1)
          
          downloader = MediaIoBaseDownload(fh, request)
          done = False
          print(f'Starting download -> {output_filename}...')
          try:
            while done is False:
              status, done = downloader.next_chunk()
              if status:
                print(f'Download {int(status.progress() * 100)}%.')
          except Exception as e:
            print(f'::error::Download failed: {e}', file=sys.stderr)
              # Ensure file handle is closed before attempting removal
            if not fh.closed:
              fh.close()
              # Attempt to remove partially downloaded file
              try:
                if os.path.exists(output_filename):
                  os.remove(output_filename)
                  print(f'Removed partially downloaded file: {output_filename}')
              except OSError as oe:
                print(f'Warning: Could not remove partial file {output_filename}: {oe}', file=sys.stderr)
              sys.exit(1)
          finally:
              # Ensure file handle is closed even if download finished successfully
            if not fh.closed:
              fh.close()
          
          print(f'Download complete: {output_filename}.')
            "

        shell: bash

      - name: Extract Test Data
        run: |
          echo "Extracting test data..."
          mkdir ${{ env.TEST_DIR }}
          unzip -q ${{ env.TEST_ARCHIVE_NAME }} -d ${{ env.TEST_DIR }}
        shell: bash

      - name: Run Chisel Tests
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            CHISEL_EXE="./${{ env.BIN_DIR }}/chsl.exe"
          else
            CHISEL_EXE="./${{ env.BIN_DIR }}/chsl"
          fi
          echo "Running chisel from: $CHISEL_EXE"
          echo "Processing files in: ${{ env.TEST_DIR }}"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            "$CHISEL_EXE" "${{ env.TEST_DIR }}" --recursive --threads 3 --log-level=ALL --log-file chisel.log --iterations 2 --iterations-large 2
          else
            "$CHISEL_EXE" "${{ env.TEST_DIR }}" --recursive --threads 4 --log-level=ALL --log-file chisel.log --iterations 2 --iterations-large 2
          fi
        shell: bash

      - name: Check for errors in Chisel Log
        if: always()
        run: |
          LOG_FILE="build/chisel.log"
          if [ ! -f "$LOG_FILE" ]; then
            if [ -f "${{ github.workspace }}/chisel.log" ]; then
              LOG_FILE="${{ github.workspace }}/chisel.log"
            elif [ -f "chisel.log" ]; then
              LOG_FILE="chisel.log"
            else
              echo "Log file not found at build/chisel.log, ${{ github.workspace }}/chisel.log, or current directory."
              exit 0
            fi
          fi
          echo "Checking log file at: $LOG_FILE"
          if grep -q '\[ERROR\]' "$LOG_FILE"; then
            echo "::error::Errors detected in chisel.log!"
            grep '\[ERROR\]' "$LOG_FILE"
            exit 1
          else
            echo "No [ERROR] lines found in chisel.log."
            exit 0
          fi
        shell: bash

      - name: Upload Chisel Log File
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chisel-log-${{ matrix.asset_name }}
          path: |
            build/chisel.log
            ${{ github.workspace }}/chisel.log
            chisel.log
          if-no-files-found: warn
          retention-days: 7

  combine-logs:
    name: combine-logs
    needs: test
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Download all log artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: chisel-log-*
          path: logs

      - name: Combine logs
        run: |
          mkdir -p combined
          find logs -type f -name "*.log" -exec cat {} + > combined/chisel-combined.log
          sort -u combined/chisel-combined.log > combined/chisel-combined-unique.log

      - name: Upload combined log
        uses: actions/upload-artifact@v7
        with:
          name: chisel-combined-logs
          path: combined/
          retention-days: 14

  publish_nightly:
    name: Publish Nightly Pre-Release
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/development'

    permissions:
      actions: read
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          pattern: chsl-*
          path: binaries
          skip-decompress: true

      - name: Download logs
        uses: actions/download-artifact@v8
        with:
          pattern: chisel-log-*
          path: logs

      - name: Prepare assets for release
        run: |
          mkdir -p release_assets
          find binaries -type f \( -name 'chsl-*.tar.gz' -o -name 'chsl-*.zip' \) -exec cp {} release_assets/ \;
          # every platform's log is called chisel.log: each one goes out under its platform's name
          for dir in logs/chisel-log-*/; do
            platform=$(basename "$dir"); platform=${platform#chisel-log-}
            log=$(find "$dir" -type f -name '*.log' | head -1)
            [ -n "$log" ] && cp "$log" "release_assets/chisel-$platform.log"
          done
          ls -la release_assets

      - name: Delete and recreate 'development-latest' release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete development-latest -y || echo "No previous nightly release to delete."
          
          git push origin --delete development-latest || echo "No previous nightly tag to delete."
          
          gh release create development-latest \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Nightly Build" \
            --notes "Latest successful build from 'development' branch. Not a stable release." \
            release_assets/*

  verify-static-linking:
    name: verify-static-linking (${{ matrix.asset_name }})
    needs: build
    runs-on: ${{ matrix.runs_on }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - id: ubuntu-gcc
            runs_on: ubuntu-latest
            asset_name: "linux-x64-gcc"

          - id: ubuntu-clang
            runs_on: ubuntu-latest
            asset_name: "linux-x64-clang"

          - id: ubuntu-arm
            runs_on: ubuntu-24.04-arm
            asset_name: "linux-arm64"

          - id: ubuntu-x86
            runs_on: ubuntu-latest
            asset_name: "linux-x86"

          - id: macos-intel
            runs_on: macos-15-intel
            asset_name: "macos-x64"

          - id: macos-arm
            runs_on: macos-15
            asset_name: "macos-arm64"

          - id: windows-x64
            runs_on: windows-latest
            asset_name: "windows-x64"

          - id: windows-arm
            runs_on: windows-11-arm
            asset_name: "windows-arm64"

    env:
      BIN_DIR: bin
      FORBIDDEN_LIBS: "jpeg|png|flac|archive|zlib|jxl|tiff|qpdf|webp|wavpack|sqlite|magic|mseed|ebml|matroska|mkclean|zopfli|ape|gif|mac|flexigif|tag"

    steps:
      - name: Setup MSVC Developer Environment
        if: runner.os == 'Windows'
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: ${{ matrix.id == 'windows-arm' && 'arm64' || 'x64' }}

      - name: Download binary artifact
        uses: actions/download-artifact@v8
        with:
          name: chsl-${{ matrix.asset_name }}${{ runner.os == 'Windows' && '.zip' || '.tar.gz' }}
          path: ${{ env.BIN_DIR }}
          # the zip is the release asset itself: keep it as it was uploaded
          skip-decompress: true

      - name: Extract binary
        if: runner.os != 'Windows'
        run: |
          cd ${{ env.BIN_DIR }}
          tar -xzf "$(find . -name 'chsl-*.tar.gz' | head -1)"
          ls -la

      - name: Extract binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Get-ChildItem -Path "${{ env.BIN_DIR }}" -Recurse -Filter "chsl-*.zip" | Select-Object -First 1
          Expand-Archive -Path $archive.FullName -DestinationPath "${{ env.BIN_DIR }}" -Force
          Get-ChildItem "${{ env.BIN_DIR }}"

      - name: Verify Linux (ldd)
        if: runner.os == 'Linux'
        run: |
          echo "Checking dependencies for Linux..."
          ldd ${{ env.BIN_DIR }}/chsl
          echo "---"
          matches=$(ldd ${{ env.BIN_DIR }}/chsl | grep -iE "(${FORBIDDEN_LIBS})" || true)
          if [ -n "$matches" ]; then
            echo "::error::Found forbidden dynamic libraries!"
            echo "$matches"
            exit 1
          else
            echo "OK: No forbidden dynamic libraries found."
          fi

      - name: Verify macOS (otool)
        if: runner.os == 'macOS'
        run: |
          echo "Checking dependencies for macOS..."
          otool -L ${{ env.BIN_DIR }}/chsl
          echo "---"
          matches=$(otool -L ${{ env.BIN_DIR }}/chsl | grep -iE "(${FORBIDDEN_LIBS})" || true)
          if [ -n "$matches" ]; then
            echo "::error::Found forbidden dynamic libraries!"
            echo "$matches"
            exit 1
          else
            echo "OK: No forbidden dynamic libraries found."
          fi

      - name: Verify Windows (dumpbin + PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Output "Checking dependencies for Windows..."
          $deps = & dumpbin /dependents "${{ env.BIN_DIR }}\chsl.exe"
          $deps | Out-String | Write-Output
          Write-Output "---"
          $pattern = [regex]"(${env:FORBIDDEN_LIBS})\.dll"
          $matches = $deps | Select-String -Pattern $pattern -AllMatches
          if ($matches) {
            Write-Error "Found forbidden dynamic libraries!"
            $matches | ForEach-Object { $_.Matches.Value } | Sort-Object -Unique | ForEach-Object { Write-Output $_ }
            exit 1
          } else {
            Write-Output "OK: No forbidden dynamic libraries found."
          }
