name: Update package managers

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  update-tap:
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ github.event.release.tag_name }}
    steps:
      - name: Checkout Homebrew Tap
        uses: actions/checkout@v6
        with:
          repository: Snesnopic/homebrew-tools
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: homebrew-tap

      - name: Update Formula
        run: |
          CLEAN_VER="${TAG_NAME#v}"
          echo "Updating Formula for version: $CLEAN_VER (Tag: $TAG_NAME)"
          
          BASE_URL="https://github.com/Snesnopic/chisel/releases/download/${TAG_NAME}"
          
          wget -q "${BASE_URL}/chsl-macos-arm64.tar.gz"
          wget -q "${BASE_URL}/chsl-macos-x64.tar.gz"
          wget -q "${BASE_URL}/chsl-linux-x64-gcc.tar.gz"
          wget -q "${BASE_URL}/chsl-linux-arm64.tar.gz"
          
          SHA_MAC_ARM=$(sha256sum chsl-macos-arm64.tar.gz | awk '{print $1}')
          SHA_MAC_INTEL=$(sha256sum chsl-macos-x64.tar.gz | awk '{print $1}')
          SHA_LINUX_INTEL=$(sha256sum chsl-linux-x64-gcc.tar.gz | awk '{print $1}')
          SHA_LINUX_ARM=$(sha256sum chsl-linux-arm64.tar.gz | awk '{print $1}')
          
          mkdir -p homebrew-tap/Formula
          cat > homebrew-tap/Formula/chsl.rb <<EOF
          class Chsl < Formula
            desc "Lossless file optimizer, supporting 160+ types, multithreading and recursive optimization (files inside other files)"
            homepage "https://github.com/Snesnopic/chisel"
            license "MIT"

            head do
              url "https://github.com/Snesnopic/chisel.git", branch: "main"
              depends_on "cmake" => :build
              depends_on "rust" => :build
            end

            on_macos do
              on_arm do
                url "${BASE_URL}/chsl-macos-arm64.tar.gz"
                sha256 "${SHA_MAC_ARM}"
              end
              on_intel do
                url "${BASE_URL}/chsl-macos-x64.tar.gz"
                sha256 "${SHA_MAC_INTEL}"
              end
            end

            on_linux do
              on_intel do
                url "${BASE_URL}/chsl-linux-x64-gcc.tar.gz"
                sha256 "${SHA_LINUX_INTEL}"
              end
              on_arm do
                url "${BASE_URL}/chsl-linux-arm64.tar.gz"
                sha256 "${SHA_LINUX_ARM}"
              end
            end

            def install
              if build.head?
                system "cmake", "-S", ".", "-B", "build", *std_cmake_args
                system "cmake", "--build", "build", "--config", "Release"
                bin.install "bin/Release/chsl"
              else
                bin.install "chsl"
                if OS.mac?
                  # the release tarballs carry a quarantine flag that makes macOS kill the binary
                  chmod "u+w", bin/"chsl"
                  quiet_system "/usr/bin/xattr", "-d", "com.apple.quarantine", bin/"chsl"
                end
              end
            end

            def caveats
              return unless OS.mac?

              <<~EOS
                A native macOS app is available too:
                  brew install --cask snesnopic/tools/chisel
              EOS
            end

            test do
              assert_match "chisel", shell_output("#{bin}/chsl --help")
            end
          end
          EOF

      - name: Commit and Push
        run: |
          cd homebrew-tap
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          
          if [[ -n $(git status -s) ]]; then
            git add Formula/chsl.rb
            git commit -m "Update chisel formula to ${TAG_NAME}"
            git push
          else
            echo "Formula already up to date."
          fi

  # the manifest is written in full, as the formula is: wingetcreate update can't turn the portable zip package into an installer one
  update-winget:
    runs-on: windows-latest
    env:
      WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
      TAG_NAME: ${{ github.event.release.tag_name }}
      PUBLISHED_AT: ${{ github.event.release.published_at }}
    steps:
      - name: Write the manifest
        shell: pwsh
        run: |
          if (-not $env:TAG_NAME) { throw 'no release tag' }
          $version = $env:TAG_NAME.TrimStart('v')
          $base = "https://github.com/Snesnopic/chisel/releases/download/$env:TAG_NAME"
          # the installer's AppId (chisel_win/installer/chisel.iss) plus Inno's suffix
          $productCode = '{0DD956F3-D080-4F33-B823-86858AF5B03B}_is1'
          $installers = foreach ($arch in 'x64', 'arm64', 'x86') {
            $file = "chisel-setup-windows-$arch.exe"
            Invoke-WebRequest -Uri "$base/$file" -OutFile $file -MaximumRetryCount 5 -RetryIntervalSec 10
            $sha = (Get-FileHash $file -Algorithm SHA256).Hash
            "- Architecture: $arch`n  InstallerUrl: $base/$file`n  InstallerSha256: $sha"
          }
          $dir = "manifest\$version"
          New-Item -ItemType Directory -Force $dir | Out-Null

          @"
          PackageIdentifier: Snesnopic.Chisel
          PackageVersion: $version
          DefaultLocale: en-US
          ManifestType: version
          ManifestVersion: 1.10.0
          "@ | Set-Content "$dir\Snesnopic.Chisel.yaml"

          @"
          PackageIdentifier: Snesnopic.Chisel
          PackageVersion: $version
          InstallerType: inno
          Scope: user
          InstallModes:
          - interactive
          - silent
          - silentWithProgress
          UpgradeBehavior: install
          Commands:
          - chisel
          - chsl
          ProductCode: '$productCode'
          MinimumOSVersion: 10.0.18362.0
          ReleaseDate: $($env:PUBLISHED_AT.Substring(0, 10))
          Installers:
          $($installers -join "`n")
          ManifestType: installer
          ManifestVersion: 1.10.0
          "@ | Set-Content "$dir\Snesnopic.Chisel.installer.yaml"

          @"
          PackageIdentifier: Snesnopic.Chisel
          PackageVersion: $version
          PackageLocale: en-US
          Publisher: Snesnopic
          PublisherUrl: https://github.com/Snesnopic
          PublisherSupportUrl: https://github.com/Snesnopic/chisel/issues
          PackageName: Chisel
          PackageUrl: https://github.com/Snesnopic/chisel
          License: MIT
          LicenseUrl: https://github.com/Snesnopic/chisel/blob/main/LICENSE
          ShortDescription: Lossless file optimizer and re-compressor
          Tags:
          - cli
          - compression
          - cpp
          - gui
          - linux
          - macos
          - recompression
          - windows
          ReleaseNotesUrl: https://github.com/Snesnopic/chisel/releases/tag/$env:TAG_NAME
          ManifestType: defaultLocale
          ManifestVersion: 1.10.0
          "@ | Set-Content "$dir\Snesnopic.Chisel.locale.en-US.yaml"

          Get-ChildItem $dir | ForEach-Object { Write-Output "== $($_.Name)"; Get-Content $_.FullName }
          "MANIFEST_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PACKAGE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Submit the manifest
        shell: pwsh
        run: |
          curl.exe -JLO https://aka.ms/wingetcreate/latest
          .\wingetcreate.exe submit --prtitle "New version: Snesnopic.Chisel version $env:PACKAGE_VERSION" $env:MANIFEST_DIR
          if ($LASTEXITCODE -ne 0) { throw "wingetcreate exited with $LASTEXITCODE" }
