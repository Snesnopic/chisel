name: Update package managers

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  update-tap:
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ github.event.release.tag_name }}
    steps:
      - name: Checkout Homebrew Tap
        uses: actions/checkout@v6
        with:
          repository: Snesnopic/homebrew-tools
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: homebrew-tap

      - name: Update Formula
        run: |
          CLEAN_VER="${TAG_NAME#v}"
          echo "Updating Formula for version: $CLEAN_VER (Tag: $TAG_NAME)"
          
          BASE_URL="https://github.com/Snesnopic/chisel/releases/download/${TAG_NAME}"
          
          wget -q "${BASE_URL}/chsl-macos-arm64.tar.gz"
          wget -q "${BASE_URL}/chsl-macos-x64.tar.gz"
          wget -q "${BASE_URL}/chsl-linux-x64-gcc.tar.gz"
          wget -q "${BASE_URL}/chsl-linux-arm64.tar.gz"
          
          SHA_MAC_ARM=$(sha256sum chsl-macos-arm64.tar.gz | awk '{print $1}')
          SHA_MAC_INTEL=$(sha256sum chsl-macos-x64.tar.gz | awk '{print $1}')
          SHA_LINUX_INTEL=$(sha256sum chsl-linux-x64-gcc.tar.gz | awk '{print $1}')
          SHA_LINUX_ARM=$(sha256sum chsl-linux-arm64.tar.gz | awk '{print $1}')
          
          mkdir -p homebrew-tap/Formula
          cat > homebrew-tap/Formula/chsl.rb <<EOF
          class Chsl < Formula
            desc "Lossless file optimizer, supporting 160+ types, multithreading and recursive optimization (files inside other files)"
            homepage "https://github.com/Snesnopic/chisel"
            version "${CLEAN_VER}"
            license "MIT"

            head "https://github.com/Snesnopic/chisel.git", branch: "main"
          
            depends_on "cmake" => :build
            depends_on "rust" => :build

            if OS.mac? && Hardware::CPU.arm?
              url "${BASE_URL}/chsl-macos-arm64.tar.gz"
              sha256 "${SHA_MAC_ARM}"
            elsif OS.mac? && Hardware::CPU.intel?
              url "${BASE_URL}/chsl-macos-x64.tar.gz"
              sha256 "${SHA_MAC_INTEL}"
            elsif OS.linux? && Hardware::CPU.intel?
              url "${BASE_URL}/chsl-linux-x64-gcc.tar.gz"
              sha256 "${SHA_LINUX_INTEL}"
            elsif OS.linux? && Hardware::CPU.arm?
              url "${BASE_URL}/chsl-linux-arm64.tar.gz"
              sha256 "${SHA_LINUX_ARM}"
            end

            def install
              if build.head?
                system "cmake", "-S", ".", "-B", "build", *std_cmake_args
                system "cmake", "--build", "build", "--config", "Release"
                bin.install "bin/Release/chsl"
              else
                bin.install "chsl"
              end
            end

            test do
              assert_match "chisel", shell_output("#{bin}/chsl --help")
            end
          end
          EOF

      - name: Commit and Push
        run: |
          cd homebrew-tap
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          
          if [[ -n $(git status -s) ]]; then
            git add Formula/chsl.rb
            git commit -m "Update chisel formula to ${TAG_NAME}"
            git push
          else
            echo "Formula already up to date."
          fi

  update-winget:
    runs-on: windows-latest
    env:
      WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - name: Submit package using wingetcreate
        shell: powershell
        run: |
          # extract version and assets from release event
          $rawVersion = "${{ github.event.release.tag_name }}"
          $packageVersion = $rawVersion.TrimStart('v')
          $assets = '${{ toJSON(github.event.release.assets) }}' | ConvertFrom-Json

          Write-Host "STARTING WINGET SUBMISSION FOR VERSION: $packageVersion"

          # filter urls for each architecture based on asset names
          $urlX64 = $assets | Where-Object -Property name -like '*windows-x64.zip' | Select-Object -ExpandProperty browser_download_url
          $urlX86 = $assets | Where-Object -Property name -like '*windows-x86.zip' | Select-Object -ExpandProperty browser_download_url
          $urlArm64 = $assets | Where-Object -Property name -like '*windows-arm64.zip' | Select-Object -ExpandProperty browser_download_url

          # download latest wingetcreate standalone binary
          curl.exe -JLO https://aka.ms/wingetcreate/latest

          # execute update with explicit architecture mapping
          $urls = @()
          if ($urlX64) { $urls += "$urlX64|x64" }
          if ($urlX86) { $urls += "$urlX86|x86" }
          if ($urlArm64) { $urls += "$urlArm64|arm64" }

          .\wingetcreate.exe update Snesnopic.Chisel `
            --version $packageVersion `
            --urls $urls `
            --submit